<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>3D 贪吃蛇 · NEON SNAKE</title>
<style>
  :root {
    --mint: #46f2c0;
    --cyan: #4fd7ff;
    --pink: #ff5d8f;
    --gold: #ffd35c;
    --ink: #05070f;
    --panel: rgba(12, 20, 36, 0.62);
    --line: rgba(90, 240, 205, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 100% at 50% 0%, #0d1830 0%, #070c18 45%, #04060d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e8f4ff;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(115% 85% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.42) 78%, rgba(0,0,0,0.72) 100%);
  }
  .hud {
    position: fixed; z-index: 5; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 14px calc(16px + env(safe-area-inset-left));
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 8px 16px 9px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(160, 200, 220, 0.62); font-weight: 600; margin-bottom: 2px;
  }
  .score-value {
    font-size: 30px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; color: var(--mint);
    background: linear-gradient(180deg, #ccfff0 0%, var(--mint) 55%, #19b891 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    transition: transform 0.18s ease;
  }
  .score-value.pop { transform: scale(1.22); }
  .best-value {
    font-size: 20px; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums;
    color: #9fd8ff;
  }
  .spacer { flex: 1; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--line); color: #cfeeff;
    font-size: 17px; line-height: 1; display: grid; place-items: center;
    cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .icon-btn:hover { border-color: rgba(90,240,205,0.42); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.off { opacity: 0.42; }
  .toast {
    position: fixed; z-index: 6; left: 50%; top: 21%; transform: translate(-50%, 0) scale(0.9);
    font-size: 22px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--mint); text-shadow: 0 0 18px rgba(70,242,192,0.65);
    opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.28s cubic-bezier(.2,1.6,.4,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -14px) scale(1); }
  .toast.gold { color: var(--gold); text-shadow: 0 0 20px rgba(255,211,92,0.7); }

  .dpad {
    position: fixed; z-index: 5; right: calc(18px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
    display: none; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 6px;
  }
  .dpad.show { display: grid; }
  .dir {
    border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
    color: #bdf6e6; font-size: 17px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: grid; place-items: center; cursor: pointer;
  }
  .dir:active { background: rgba(70,242,192,0.22); border-color: rgba(70,242,192,0.5); }
  .dir.up { grid-area: 1 / 2; }
  .dir.left { grid-area: 2 / 1; }
  .dir.right { grid-area: 2 / 3; }
  .dir.down { grid-area: 3 / 2; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    padding: 24px; background: radial-gradient(90% 70% at 50% 45%, rgba(6,12,24,0.55), rgba(3,5,11,0.88));
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    transition: opacity 0.32s ease, visibility 0.32s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .card { width: min(440px, 92vw); text-align: center; }
  .logo {
    font-size: 11px; letter-spacing: 0.55em; font-weight: 700; color: rgba(90,240,205,0.75);
    margin-bottom: 10px; text-indent: 0.55em;
  }
  h1 {
    margin: 0 0 12px; font-size: clamp(38px, 11vw, 58px); line-height: 1.04; letter-spacing: -0.02em;
    font-weight: 900;
    background: linear-gradient(115deg, #d9fff5 0%, var(--mint) 38%, var(--cyan) 78%, #8f7dff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 30px rgba(70,242,192,0.28));
  }
  .sub { margin: 0 0 22px; font-size: 14.5px; line-height: 1.6; color: rgba(178, 205, 225, 0.78); }
  .stats { font-size: 13.5px; color: #9fe6d3; margin: -6px 0 20px; letter-spacing: 0.02em; min-height: 0; }
  .stats:empty { display: none; }
  .primary {
    appearance: none; border: 0; cursor: pointer;
    padding: 16px 46px; border-radius: 999px;
    font-size: 16.5px; font-weight: 800; letter-spacing: 0.06em; color: #04241c;
    background: linear-gradient(120deg, #8dffd9, var(--mint) 45%, #3ec9ff 100%);
    box-shadow: 0 14px 34px rgba(54, 226, 186, 0.32), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.14s ease, box-shadow 0.24s ease;
  }
  .primary:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(54,226,186,0.44), inset 0 1px 0 rgba(255,255,255,0.7); }
  .primary:active { transform: translateY(0) scale(0.98); }
  .hint { margin: 22px 0 0; font-size: 11.5px; line-height: 1.9; color: rgba(150, 180, 205, 0.55); letter-spacing: 0.02em; }
  .fatal { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; color: #ff8fa8; }
  @media (max-width: 560px) {
    .panel { padding: 6px 12px 7px; border-radius: 14px; }
    .score-value { font-size: 24px; }
    .best-value { font-size: 16px; }
    .icon-btn { width: 38px; height: 38px; font-size: 15px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<header class="hud">
  <div class="panel">
    <div class="label">SCORE</div>
    <div class="score-value" id="score">0</div>
  </div>
  <div class="panel">
    <div class="label">BEST</div>
    <div class="best-value" id="best">0</div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnSound" title="声音开关">🔊</button>
  <button class="icon-btn" id="btnCamera" title="切换视角">🎥</button>
  <button class="icon-btn" id="btnPause" title="暂停 / 继续">⏸</button>
</header>

<div class="toast" id="toast"></div>

<div class="dpad" id="dpad">
  <button class="dir up" data-dir="up" aria-label="上">▲</button>
  <button class="dir left" data-dir="left" aria-label="左">◀</button>
  <button class="dir right" data-dir="right" aria-label="右">▶</button>
  <button class="dir down" data-dir="down" aria-label="下">▼</button>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="logo">NEON SNAKE</div>
    <h1 id="ovTitle">3D 贪吃蛇</h1>
    <p class="sub" id="ovSub">吃掉能量球，别撞墙，也别咬到自己的尾巴</p>
    <div class="stats" id="ovStats"></div>
    <button class="primary" id="btnPlay">开始游戏</button>
    <p class="hint">方向键 / WASD / 滑动屏幕<br>空格 暂停 · R 重开 · C 切换视角</p>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
